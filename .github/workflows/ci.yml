# Runs on every push and pull request. Needs no real secrets: the tests use temporary databases and the local
# mocks for LinkedIn, Deepgram and Clerk, and every value they need is set by the test itself.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Unit and integration tests (temporary databases, mocked services)
        run: python -m unittest discover -s tests
        env:
          # Placeholders: the test modules set their own, and no test calls a real service.
          SECRET_KEY: ci-placeholder-secret-key-0123456789-abcdef
          ENCRYPTION_KEY: ci-placeholder-encryption-key-0123456789
          AUTH_PROVIDER: local

  frontend:
    name: Frontend typecheck, build and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: http://127.0.0.1:8011
      - name: Colour contrast
        working-directory: frontend
        run: npm run contrast
      # The browser tests start the fixture API from backend/.venv (see frontend/playwright.config.ts).
      - name: Backend fixture server environment
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install -r backend/requirements.txt
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Playwright specs (Chromium, mocked API)
        working-directory: frontend
        run: npx playwright test --grep-invert "review screenshots"
        env:
          CI: "true"
          VITE_CLERK_PUBLISHABLE_KEY: ""
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: frontend/test-results
          retention-days: 7

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the whole history, not just the latest commit
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: npm audit (fails on high or critical)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # pip-audit reports no severity, so any known vulnerability in a pinned requirement fails this step.
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt --no-deps --disable-pip
