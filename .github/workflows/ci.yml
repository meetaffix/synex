# Runs on every push and pull request. Needs no real secrets: the tests use temporary databases and the local
# mocks for LinkedIn, Deepgram and Clerk, and every value they need is set by the test itself.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Environment check (names only; warns about the missing .env, fails on real errors)
        run: python -m app.check_env
        env:
          SECRET_KEY: ci-placeholder-secret-key-0123456789-abcdef
          ENCRYPTION_KEY: ci-placeholder-encryption-key-0123456789
          AUTH_PROVIDER: local
      - name: Unit and integration tests (temporary databases, mocked services)
        # Every test class runs in its own process (run_tests.py), as the tests expect: several set their own environment before the app loads,
        # which a single shared process cannot honour. It also checks that it ran exactly the tests the sequential loader counts.
        run: python run_tests.py
        env:
          # Placeholders: the test modules set their own, and no test calls a real service.
          SECRET_KEY: ci-placeholder-secret-key-0123456789-abcdef
          ENCRYPTION_KEY: ci-placeholder-encryption-key-0123456789
          AUTH_PROVIDER: local

  frontend:
    name: Frontend typecheck, build and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: http://127.0.0.1:8011
      - name: Bundle secret check (no server secret in the built frontend)
        working-directory: frontend
        run: npm run check:bundle
      - name: Colour contrast
        working-directory: frontend
        run: npm run contrast
      # The browser tests start the fixture API from backend/.venv (see frontend/playwright.config.ts).
      - name: Backend fixture server environment
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install -r backend/requirements.txt
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Playwright specs (Chromium, mocked API)
        working-directory: frontend
        run: npx playwright test --grep-invert "review screenshots"
        env:
          CI: "true"
          PW_PREVIEW: "1"  # the production build behind vite preview, not the dev server (which runs effects twice)
          VITE_CLERK_PUBLISHABLE_KEY: ""
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: frontend/test-results
          retention-days: 7

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # DEFERRED ON PURPOSE (owner decision, 15 Nov 2026): this job does not block any merge. It keeps running so its
    # result stays visible. Its 10 findings so far are placeholder values in this workflow and in five test files,
    # not real secrets. It must be fixed and clean over the full history before any public repository, any production
    # deploy or any real user (docs/ROADMAP.md, "Known debt").
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the whole history, not just the latest commit
      # The gitleaks action cannot scan a repository whose first push contains the root commit, so the pinned release
      # is installed (checksum verified) and run over the whole history. Findings are redacted in the log.
      - name: Install gitleaks
        run: |
          VERSION=8.24.3
          BASE=https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}
          ARCHIVE=gitleaks_${VERSION}_linux_x64.tar.gz
          # Keep the release's own file names: the checksums file lists them, and sha256sum looks files up by name.
          curl -fsSLO ${BASE}/${ARCHIVE}
          curl -fsSL -o checksums.txt ${BASE}/gitleaks_${VERSION}_checksums.txt
          grep " ${ARCHIVE}$" checksums.txt | sha256sum -c -
          tar xzf ${ARCHIVE} gitleaks
      - name: Scan every commit
        run: ./gitleaks git --redact --verbose --config .gitleaks.toml --exit-code 2

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: npm audit (fails on high or critical)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # pip-audit reports no severity, so any known vulnerability in a pinned requirement fails this step.
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt --no-deps --disable-pip
