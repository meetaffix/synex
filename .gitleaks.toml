# Secret scanning configuration (used by the CI "Secret scan" job).
title = "Synex gitleaks config"

[extend]
useDefault = true

# Fake placeholder values only: test keys (for example a sentinel that must never appear in a response), the CI workflow's
# placeholder environment, the mocked API and an old helper script. A real-looking key anywhere else is still reported.
[allowlist]
description = "Fake keys used by the tests and CI placeholders"
paths = [
  '''backend/tests/.*\.py''',
  '''frontend/tests/.*''',
  '''\.github/workflows/ci\.yml''',
  '''flaky-loop\.sh''',
]
